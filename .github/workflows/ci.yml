name: CI

# Trigger is workflow_dispatch only: CI runs on main once a day from ci-dispatch on S's Mac (ledger ci-daily-dispatch-go, 2026-09-10).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Lockfile up-to-date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Dependency vulnerability audit
        run: uv run pip-audit --skip-editable

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Version sync check
        run: uv run python scripts/sync_version.py --check

      # The suite is the repo's `.suite-command`, the same one-line command the
      # pre-push gate runs through suite-run, so CI and the local gate cannot
      # drift apart (ledger slug ci-workflow-runs-suite-command, 2026-11-03).
      # Copied from ~/.claude/templates/workflow-quality-python.yml.
      # TWIN: change suite-run's parse rule and this step together.
      - name: Run the suite (.suite-command)
        run: |
          if [ -L .suite-command ]; then
            echo "::error::.suite-command is a symlink; it must be a regular file committed in the repo"
            exit 1
          fi
          if [ ! -f .suite-command ]; then
            echo "::error::.suite-command is missing; add the repo's full test command on one line (a lint or build if it has no tests)"
            exit 1
          fi
          cmd=$(awk '{ s = $0; sub(/^[ \t\r]+/, "", s); sub(/[ \t\r]+$/, "", s); if (s != "" && substr(s, 1, 1) != "#") print s }' .suite-command)
          n=$(printf '%s' "$cmd" | awk 'END { print NR }')
          if [ "$n" -eq 0 ]; then
            echo "::error::.suite-command holds no command line (only blanks and comments)"
            exit 1
          fi
          if [ "$n" -gt 1 ]; then
            echo "::error::.suite-command has $n command lines; it must hold exactly one (chain with && if needed)"
            exit 1
          fi
          echo "Suite command: $cmd"
          /bin/sh -c "$cmd"
